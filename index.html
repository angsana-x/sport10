<style>
  :root { --pri:#0B2545; --pri2:#16407A; --acc:#1F9A1F; --acc2:#4CD01A; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--pri); overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #app { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; display:block; background:#F3F6FA; }
  #splash { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; color:#fff;
    background: radial-gradient(1200px 600px at 50% -10%, #1d4f8f 0%, transparent 60%), linear-gradient(160deg,#081B33 0%, var(--pri) 50%, var(--pri2) 100%);
    transition: opacity .45s ease, visibility .45s ease; }
  #splash.hide { opacity:0; visibility:hidden; }
  .badge { width:168px; height:168px; border-radius:36px; background:#fff; display:grid; place-items:center;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 0 0 4px rgba(76,208,26,.9); animation: pop .6s ease both; }
  .badge img { width:142px; height:auto; }
  .brand { font-size:38px; font-weight:900; font-style:italic; letter-spacing:.01em; margin:6px 0 0; line-height:1; }
  .brand i { color:var(--acc2); }
  .tag { font-size:16px; font-weight:700; opacity:.95; margin:0; }
  .rw { font-size:13px; opacity:.7; margin:0; }
  .bar { width:180px; height:4px; border-radius:99px; background:rgba(255,255,255,.15); overflow:hidden; margin-top:10px; }
  .bar::after { content:""; display:block; width:40%; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2)); animation: load 1.1s ease-in-out infinite; }
  .msg { font-size:13px; opacity:.75; min-height:18px; margin:0; }
  .open { display:none; margin-top:6px; padding:12px 20px; border-radius:12px; font-weight:800; font-size:15px; color:var(--pri);
    background:#fff; text-decoration:none; box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .open.show { display:inline-block; }
  @keyframes load { 0% { transform:translateX(-110%); } 100% { transform:translateX(260%); } }
  @keyframes pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .badge, .bar::after { animation:none; } }
</style>
